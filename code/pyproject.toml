[project]
name = "hello-agents-book"
version = "0.1.0"
description = ""
authors = [
    {name = "Sumkor",email = "sumkor@foxmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy (>=2.4.4,<3.0.0)",
    "tavily (>=1.1.0,<2.0.0)",
    "requests (>=2.33.1,<3.0.0)",
    "transformers (>=5.5.3,<6.0.0)",
    "torch (==2.6.0)",
    "torchvision (==0.21.0)",
    "torchaudio (==2.6.0)",
    "openai (>=2.31.0,<3.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "serpapi (>=1.0.2,<2.0.0)",
    "streamlit (>=1.57.0,<2.0.0)",
    "autogen-ext (>=0.7.5,<0.8.0)",
    "autogen-agentchat (>=0.7.5,<0.8.0)",
    "camel-ai (>=0.2.90,<0.3.0)",
    "agentscope (>=1.0.20,<2.0.0)",
    "langchain-core (>=1.4.0,<2.0.0)",
    "langchain-openai (>=1.2.2,<2.0.0)",
    "langgraph (>=1.2.1,<2.0.0)",
    "hello-agents (==0.1.1)",
    "pytest (>=9.1.1,<10.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
priority = "explicit"


[tool.poetry.dependencies]
torch = {source = "pytorch-cu126"}
torchvision = {source = "pytorch-cu126"}
torchaudio = {source = "pytorch-cu126"}
